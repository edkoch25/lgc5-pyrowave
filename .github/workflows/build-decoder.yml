name: Build PyroWave ARM32 decoder

on:
  workflow_dispatch:
  push:
    branches:
      - development/pyrowave-decoder

concurrency:
  group: pyrowave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/pyrowave-decoder

      - name: Validate PyroWave frame ingress parser
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/pyrowave_records_test.c -o /tmp/pyrowave_records_test
          /tmp/pyrowave_records_test
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/pyrowave_ingest_test.c -o /tmp/pyrowave_ingest_test
          /tmp/pyrowave_ingest_test

      - name: Fetch pinned PyroWave and Granite
        shell: bash
        run: |
          set -euo pipefail
          source UPSTREAM.lock
          git clone https://github.com/${PYROWAVE_REPO}.git pyrowave
          cd pyrowave
          git checkout --detach "${PYROWAVE_COMMIT}"
          bash checkout_granite.sh
          git submodule status
          python3 - <<'PY'
          from pathlib import Path
          path = Path("third_party/granite/vulkan/context.cpp")
          if not path.exists():
              matches = list(Path(".").rglob("vulkan/context.cpp"))
              assert len(matches) == 1, matches
              path = matches[0]
          source = path.read_text()
          needle = 'addr = reinterpret_cast<PFN_vkGetInstanceProcAddr>(dlsym(module, "vkGetInstanceProcAddr"));'
          assert source.count(needle) == 1
          # webOS ships the Mali ICD directly, without libvulkan.so or libvulkan.so.1.
          # Prefer the system ICD only after the normal loader lookup fails.
          # Anchor after the platform-specific loader selection: the bare if-block appears twice.
          loader_fallback = '#endif' + chr(10) + chr(9) * 3 + 'if (!module)' + chr(10) + chr(9) * 4 + 'return false;'
          assert source.count(loader_fallback) == 1, "Granite Vulkan loader fallback location changed"
          source = source.replace(loader_fallback,
              '#endif' + chr(10) + chr(9) * 3 + 'if (!module)' + chr(10) + chr(9) * 4 +
              'module = dlopen("/usr/lib/libmali.so", RTLD_LOCAL | RTLD_LAZY);' +
              chr(10) + chr(9) * 3 + 'if (!module)' +
              chr(10) + chr(9) * 4 + 'return false;')
          assert source.count('dlopen("/usr/lib/libmali.so"') == 1
          replacement = needle + '''
          // LG webOS Mali exposes the Vulkan ICD interface, not the loader interface.
          if (!addr)
          {
              using Negotiate = int32_t (*)(uint32_t *);
              auto negotiate = reinterpret_cast<Negotiate>(dlsym(module, "vk_icdNegotiateLoaderICDInterfaceVersion"));
              if (negotiate)
              {
                  uint32_t interface_version = 5;
                  if (negotiate(&interface_version) != 0)
                      return false;
              }
              addr = reinterpret_cast<PFN_vkGetInstanceProcAddr>(dlsym(module, "vk_icdGetInstanceProcAddr"));
          }
          '''
          path.write_text(source.replace(needle, replacement))
          print("Patched Granite Vulkan loader:", path)
          # Trace the exact PYROWAVE_ERROR_NO_VULKAN return path in the pinned C API.
          api = Path("pyrowave_c.cpp")
          code = api.read_text()
          start = code.index("pyrowave_result pyrowave_create_device_by_compat(")
          end = code.index("pyrowave_result pyrowave_create_default_device(", start)
          body = code[start:end]
          assert body.count("return PYROWAVE_ERROR_NO_VULKAN;") == 5
          assert body.count("if (!Context::init_loader(nullptr))") == 1
          assert body.count("if (!dev->context.init_instance(nullptr, 0, CONTEXT_CREATION_ENABLE_VIDEO_FEATURE_ONLY_BIT))") == 1
          assert body.count("if (!selected_gpu)") == 1
          prefix = """
          static void lgc5_pw_vulkan_trace(const char *stage, int value)
          {
              FILE *f = fopen("/media/developer/apps/usr/palm/applications/com.pyrowave.lgc5.test/cache/pyrowave-diag.log", "a");
              if (!f) return;
              fprintf(f, "pyrowave Vulkan: %s value=%d\\n", stage, value);
              fclose(f);
          }
          """
          # Do not rely on Granite's logger: PyroWave explicitly disables it.
          body = body.replace("return PYROWAVE_ERROR_NO_VULKAN;",
                              '{ lgc5_pw_vulkan_trace("NO_VULKAN return", __LINE__); return PYROWAVE_ERROR_NO_VULKAN; }')
          body = body.replace("if (!Context::init_loader(nullptr))",
                              'lgc5_pw_vulkan_trace("loader begin", 0);\\n\\tif (!Context::init_loader(nullptr))')
          body = body.replace("auto *dev = new pyrowave_device_opaque();",
                              'lgc5_pw_vulkan_trace("loader ready", 1);\\n\\tauto *dev = new pyrowave_device_opaque();')
          body = body.replace("if (!dev->context.init_instance(nullptr, 0, CONTEXT_CREATION_ENABLE_VIDEO_FEATURE_ONLY_BIT))",
                              'lgc5_pw_vulkan_trace("instance begin", 0);\\n\\tif (!dev->context.init_instance(nullptr, 0, CONTEXT_CREATION_ENABLE_VIDEO_FEATURE_ONLY_BIT))')
          body = body.replace("uint32_t count;",
                              'lgc5_pw_vulkan_trace("instance ready", 1);\\n\\tuint32_t count;')
          body = body.replace("std::vector<VkPhysicalDevice> gpus(count);",
                              'lgc5_pw_vulkan_trace("GPU count", (int)count);\\n\\tstd::vector<VkPhysicalDevice> gpus(count);')
          body = body.replace("if (props.apiVersion < VK_API_VERSION_1_2)",
                              'lgc5_pw_vulkan_trace("GPU apiVersion", (int)props.apiVersion);\\n\\t\tif (props.apiVersion < VK_API_VERSION_1_2)')
          body = body.replace("if (dev->context.init_device(gpu, VK_NULL_HANDLE, nullptr, 0, CONTEXT_CREATION_ENABLE_VIDEO_FEATURE_ONLY_BIT))",
                              'lgc5_pw_vulkan_trace("GPU init_device begin", 0);\\n\\t\tif (dev->context.init_device(gpu, VK_NULL_HANDLE, nullptr, 0, CONTEXT_CREATION_ENABLE_VIDEO_FEATURE_ONLY_BIT))')
          body = body.replace("selected_gpu = gpu;",
                              'lgc5_pw_vulkan_trace("GPU init_device succeeded", 1);\\n\\t\t\tselected_gpu = gpu;')
          body = body.replace("if (!selected_gpu)",
                              'lgc5_pw_vulkan_trace("GPU init_device loop ended", selected_gpu ? 1 : 0);\\n\\tif (!selected_gpu)')
          assert 'GPU init_device begin' in body and 'GPU apiVersion' in body
          # Convert literal escape sequences inserted by the patch to real C++ line breaks.
          body = body.replace(chr(92) + "n", chr(10)).replace(chr(92) + "t", chr(9))
          code = "#include <stdio.h>" + chr(10) + code[:start] + prefix + body + code[end:]
          assert not any(chr(92) + "n" in line for line in body.splitlines() if "lgc5_pw_vulkan_trace(" in line and "fprintf" not in line)
          assert code.count('{ lgc5_pw_vulkan_trace("NO_VULKAN return", __LINE__); return PYROWAVE_ERROR_NO_VULKAN; }') == 5
          assert '#include <vulkan/vulkan.h>' not in code
          assert code.count("pyrowave_result pyrowave_create_default_device(") == 1
          assert "pyrowave Vulkan: %s" in code
          # Use Granite's supported external function-pointer initialization.
          # The test app calls this before pyrowave_create_default_device().
          marker = 'pyrowave_result pyrowave_create_device_by_compat('
          assert code.count(marker) == 1
          init_api = """
          extern "C" PYROWAVE_PUBLIC_API int lgc5_pyrowave_init_vulkan_loader(void *get_instance_proc_addr)
          {
              if (!get_instance_proc_addr)
                  return 0;
              auto get_proc = reinterpret_cast<PFN_vkGetInstanceProcAddr>(get_instance_proc_addr);
              return Vulkan::Context::init_loader(get_proc) ? 1 : 0;
          }

          """
          # Granite context.hpp already provides Vulkan declarations through Volk.
          code = code.replace(marker, init_api + marker)
          assert code.count('lgc5_pyrowave_init_vulkan_loader(') == 1
          api.write_text(code)
          print("Instrumented pinned PyroWave C API Vulkan initialization:", api)
          PY

      - name: Download webOS ARM32 toolchain
        uses: robinraju/release-downloader@v1.12
        with:
          repository: openlgtv/buildroot-nc4
          tag: webos-a38c582
          fileName: arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          out-file-path: /tmp
          extract: true

      - name: Configure and build decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          /tmp/arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh
          SDK=/tmp/arm-webos-linux-gnueabi_sdk-buildroot
          cmake -S pyrowave -B build/pyrowave -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${SDK}/share/buildroot/toolchainfile.cmake" \
            -DCMAKE_C_COMPILER="${SDK}/bin/arm-webos-linux-gnueabi-gcc" \
            -DCMAKE_CXX_COMPILER="${SDK}/bin/arm-webos-linux-gnueabi-g++" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/stage" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_INCLUDEDIR=include \
            -DPYROWAVE_DEVEL=OFF \
            -DPYROWAVE_UTILS=OFF \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          cmake --build build/pyrowave --target pyrowave-shared -j 2
          mkdir -p stage/lib
          cp -a build/pyrowave/libpyrowave-shared.so* stage/lib/
          cp pyrowave/pyrowave.h stage/
          CXX_RUNTIME="$("${SDK}/bin/arm-webos-linux-gnueabi-g++" -print-file-name=libstdc++.so.6)"
          test -f "$CXX_RUNTIME"
          cp -L "$CXX_RUNTIME" stage/lib/libstdc++.so.6
          file stage/lib/libstdc++.so.6
          strings stage/lib/libstdc++.so.6 | grep -Fx GLIBCXX_3.4.30
          "${SDK}/bin/arm-webos-linux-gnueabi-gcc" -O2 -Wall -Wextra \
            tests/decoder_device_probe.c -ldl -o stage/decoder_device_probe
          "${SDK}/bin/arm-webos-linux-gnueabi-gcc" -O2 -Wall -Wextra \
            tests/vulkan_loader_probe.c -ldl -o stage/vulkan_loader_probe
          "${SDK}/bin/arm-webos-linux-gnueabi-gcc" -std=c11 -O2 -Wall -Wextra \
            tests/pyrowave_frame_probe.c -ldl -o stage/pyrowave_frame_probe
          file stage/lib/libpyrowave-shared.so* stage/decoder_device_probe stage/vulkan_loader_probe stage/pyrowave_frame_probe
          readelf -h stage/decoder_device_probe | grep -E 'Class:|Machine:'
          test -f stage/lib/libpyrowave-shared.so.0.6.0
          # The C5 provides GLIBCXX only through 3.4.29; reject dynamic C++ runtime dependencies.
          readelf -d stage/lib/libpyrowave-shared.so.0.6.0 > /tmp/pyrowave-dynamic.txt
          cat /tmp/pyrowave-dynamic.txt
          if grep -E 'NEEDED.*\[(libstdc\+\+|libgcc_s)\.so' /tmp/pyrowave-dynamic.txt; then
            printf 'PyroWave still depends on a dynamic C++/GCC runtime\n' >&2
            exit 1
          fi
          # The webOS bridge resolves this helper with dlsym: it must be globally exported.
          readelf --dyn-syms --wide stage/lib/libpyrowave-shared.so.0.6.0 > /tmp/pyrowave-dynsymbols.txt
          grep -Eq '[[:space:]]GLOBAL[[:space:]]+DEFAULT[[:space:]]+[0-9]+[[:space:]]+lgc5_pyrowave_init_vulkan_loader
          readelf -Ws stage/lib/libpyrowave-shared.so.0.6.0 > /tmp/pyrowave-symbols.txt
          for symbol in pyrowave_get_api_version pyrowave_create_default_device \
            pyrowave_device_destroy pyrowave_decoder_device_prefers_fragment_path \
            pyrowave_decoder_create pyrowave_decoder_destroy pyrowave_decoder_clear \
            pyrowave_decoder_push_packet pyrowave_decoder_decode_is_ready \
            pyrowave_decoder_decode_cpu_buffer_synchronous; do
            grep -Eq "[[:space:]]${symbol}$" /tmp/pyrowave-symbols.txt || {
              printf 'Missing required PyroWave symbol: %s\\n' "$symbol" >&2
              exit 1
            }
          done


      - name: Download webOS packaging CLI
        uses: robinraju/release-downloader@v1.9
        with:
          repository: webosbrew/ares-cli-rs
          latest: true
          fileName: "ares-package_*_amd64.deb"
          out-file-path: temp

      - name: Build test app with bundled decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./temp/*.deb
          source UPSTREAM.lock
          git clone --filter=blob:none https://github.com/${AURORA_REPO}.git aurora
          cd aurora
          git checkout --detach "${AURORA_COMMIT}"
          git submodule update --init --recursive
          cd ..
          python3 patches/add_pyrowave_toggle.py
          python3 patches/add_pyrowave_protocol.py
          python3 patches/wire_pyrowave_codec.py
          python3 patches/connect_pyrowave_ingress.py
          python3 patches/diagnose_pyrowave_connection.py
          cd aurora
          printf '\n' >> cmake/PackageWebOS.cmake
          cat >> cmake/PackageWebOS.cmake <<'CMAKE'
          install(DIRECTORY "${CMAKE_SOURCE_DIR}/../stage/lib/" DESTINATION lib/pyrowave USE_SOURCE_PERMISSIONS)
          install(FILES "${CMAKE_SOURCE_DIR}/../stage/lib/libstdc++.so.6" DESTINATION lib/pyrowave)
          CMAKE
          export CI=true
          export TOOLCHAIN_FILE=/tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake
          ./scripts/webos/easy_build.sh \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEBOS_APPINFO_ID=com.pyrowave.lgc5.test \
            -DWEBOS_APPINFO_TITLE="LG C5 PyroWave Test"
          test -n "$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"

      - name: Upload test app IPK
        uses: actions/upload-artifact@v4
        with:
          name: lgc5-pyrowave-test-ipk
          path: aurora/dist/*.ipk
          if-no-files-found: error

      - name: Upload ARM32 decoder and test executable
        uses: actions/upload-artifact@v4
        with:
          name: lgc5-pyrowave-decoder-arm32
          path: stage/
          if-no-files-found: error
 /tmp/pyrowave-dynsymbols.txt || {
            printf 'Mali external loader helper missing from shared-library dynamic exports\\n' >&2
            exit 1
          }
          # Verify the exact runtime entrypoints used by the Aurora bridge.
          readelf -Ws stage/lib/libpyrowave-shared.so.0.6.0 > /tmp/pyrowave-symbols.txt
          for symbol in pyrowave_get_api_version pyrowave_create_default_device \
            pyrowave_device_destroy pyrowave_decoder_device_prefers_fragment_path \
            pyrowave_decoder_create pyrowave_decoder_destroy pyrowave_decoder_clear \
            pyrowave_decoder_push_packet pyrowave_decoder_decode_is_ready \
            pyrowave_decoder_decode_cpu_buffer_synchronous; do
            grep -Eq "[[:space:]]${symbol}$" /tmp/pyrowave-symbols.txt || {
              printf 'Missing required PyroWave symbol: %s\\n' "$symbol" >&2
              exit 1
            }
          done


      - name: Download webOS packaging CLI
        uses: robinraju/release-downloader@v1.9
        with:
          repository: webosbrew/ares-cli-rs
          latest: true
          fileName: "ares-package_*_amd64.deb"
          out-file-path: temp

      - name: Build test app with bundled decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./temp/*.deb
          source UPSTREAM.lock
          git clone --filter=blob:none https://github.com/${AURORA_REPO}.git aurora
          cd aurora
          git checkout --detach "${AURORA_COMMIT}"
          git submodule update --init --recursive
          cd ..
          python3 patches/add_pyrowave_toggle.py
          python3 patches/add_pyrowave_protocol.py
          python3 patches/wire_pyrowave_codec.py
          python3 patches/connect_pyrowave_ingress.py
          python3 patches/diagnose_pyrowave_connection.py
          cd aurora
          printf '\n' >> cmake/PackageWebOS.cmake
          cat >> cmake/PackageWebOS.cmake <<'CMAKE'
          install(DIRECTORY "${CMAKE_SOURCE_DIR}/../stage/lib/" DESTINATION lib/pyrowave USE_SOURCE_PERMISSIONS)
          install(FILES "${CMAKE_SOURCE_DIR}/../stage/lib/libstdc++.so.6" DESTINATION lib/pyrowave)
          CMAKE
          export CI=true
          export TOOLCHAIN_FILE=/tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake
          ./scripts/webos/easy_build.sh \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEBOS_APPINFO_ID=com.pyrowave.lgc5.test \
            -DWEBOS_APPINFO_TITLE="LG C5 PyroWave Test"
          test -n "$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"

      - name: Upload test app IPK
        uses: actions/upload-artifact@v4
        with:
          name: lgc5-pyrowave-test-ipk
          path: aurora/dist/*.ipk
          if-no-files-found: error

      - name: Upload ARM32 decoder and test executable
        uses: actions/upload-artifact@v4
        with:
          name: lgc5-pyrowave-decoder-arm32
          path: stage/
          if-no-files-found: error
