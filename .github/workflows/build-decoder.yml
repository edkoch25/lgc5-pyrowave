name: Build PyroWave ARM32 decoder

on:
  workflow_dispatch:
  push:
    branches:
      - development/pyrowave-decoder

concurrency:
  group: pyrowave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/pyrowave-decoder

      - name: Validate PyroWave frame ingress parser
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/pyrowave_records_test.c -o /tmp/pyrowave_records_test
          /tmp/pyrowave_records_test
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/pyrowave_ingest_test.c -o /tmp/pyrowave_ingest_test
          /tmp/pyrowave_ingest_test

      - name: Fetch pinned PyroWave and Granite
        shell: bash
        run: |
          set -euo pipefail
          source UPSTREAM.lock
          git clone https://github.com/${PYROWAVE_REPO}.git pyrowave
          cd pyrowave
          git checkout --detach "${PYROWAVE_COMMIT}"
          bash checkout_granite.sh
          git submodule status
          python3 - <<'PY'
          from pathlib import Path
          path = Path("third_party/granite/vulkan/context.cpp")
          if not path.exists():
              matches = list(Path(".").rglob("vulkan/context.cpp"))
              assert len(matches) == 1, matches
              path = matches[0]
          source = path.read_text()
          needle = 'addr = reinterpret_cast<PFN_vkGetInstanceProcAddr>(dlsym(module, "vkGetInstanceProcAddr"));'
          assert source.count(needle) == 1
          replacement = needle + '''
          // LG webOS Mali exposes the Vulkan ICD interface, not the loader interface.
          if (!addr)
          {
              using Negotiate = int32_t (*)(uint32_t *);
              auto negotiate = reinterpret_cast<Negotiate>(dlsym(module, "vk_icdNegotiateLoaderICDInterfaceVersion"));
              if (negotiate)
              {
                  uint32_t interface_version = 5;
                  if (negotiate(&interface_version) != 0)
                      return false;
              }
              addr = reinterpret_cast<PFN_vkGetInstanceProcAddr>(dlsym(module, "vk_icdGetInstanceProcAddr"));
          }
          '''
          path.write_text(source.replace(needle, replacement))
          print("Patched Granite Vulkan loader:", path)
          PY

      - name: Download webOS ARM32 toolchain
        uses: robinraju/release-downloader@v1.12
        with:
          repository: openlgtv/buildroot-nc4
          tag: webos-a38c582
          fileName: arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          out-file-path: /tmp
          extract: true

      - name: Configure and build decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          /tmp/arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh
          SDK=/tmp/arm-webos-linux-gnueabi_sdk-buildroot
          cmake -S pyrowave -B build/pyrowave -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${SDK}/share/buildroot/toolchainfile.cmake" \
            -DCMAKE_C_COMPILER="${SDK}/bin/arm-webos-linux-gnueabi-gcc" \
            -DCMAKE_CXX_COMPILER="${SDK}/bin/arm-webos-linux-gnueabi-g++" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/stage" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_INCLUDEDIR=include \
            -DPYROWAVE_DEVEL=OFF \
            -DPYROWAVE_UTILS=OFF \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          cmake --build build/pyrowave --target pyrowave-shared -j 2
          mkdir -p stage/lib
          cp -a build/pyrowave/libpyrowave-shared.so* stage/lib/
          cp pyrowave/pyrowave.h stage/
          CXX_RUNTIME="$("${SDK}/bin/arm-webos-linux-gnueabi-g++" -print-file-name=libstdc++.so.6)"
          test -f "$CXX_RUNTIME"
          cp -L "$CXX_RUNTIME" stage/lib/libstdc++.so.6
          file stage/lib/libstdc++.so.6
          strings stage/lib/libstdc++.so.6 | grep -Fx GLIBCXX_3.4.30
          "${SDK}/bin/arm-webos-linux-gnueabi-gcc" -O2 -Wall -Wextra \
            tests/decoder_device_probe.c -ldl -o stage/decoder_device_probe
          "${SDK}/bin/arm-webos-linux-gnueabi-gcc" -O2 -Wall -Wextra \
            tests/vulkan_loader_probe.c -ldl -o stage/vulkan_loader_probe
          "${SDK}/bin/arm-webos-linux-gnueabi-gcc" -std=c11 -O2 -Wall -Wextra \
            tests/pyrowave_frame_probe.c -ldl -o stage/pyrowave_frame_probe
          file stage/lib/libpyrowave-shared.so* stage/decoder_device_probe stage/vulkan_loader_probe stage/pyrowave_frame_probe
          readelf -h stage/decoder_device_probe | grep -E 'Class:|Machine:'
          test -f stage/lib/libpyrowave-shared.so.0.6.0
          # The C5 provides GLIBCXX only through 3.4.29; reject dynamic C++ runtime dependencies.
          readelf -d stage/lib/libpyrowave-shared.so.0.6.0 > /tmp/pyrowave-dynamic.txt
          cat /tmp/pyrowave-dynamic.txt
          if grep -E 'NEEDED.*\[(libstdc\+\+|libgcc_s)\.so' /tmp/pyrowave-dynamic.txt; then
            printf 'PyroWave still depends on a dynamic C++/GCC runtime\n' >&2
            exit 1
          fi
          # Verify the exact runtime entrypoints used by the Aurora bridge.
          readelf -Ws stage/lib/libpyrowave-shared.so.0.6.0 > /tmp/pyrowave-symbols.txt
          for symbol in pyrowave_get_api_version pyrowave_create_default_device \
            pyrowave_device_destroy pyrowave_decoder_device_prefers_fragment_path \
            pyrowave_decoder_create pyrowave_decoder_destroy pyrowave_decoder_clear \
            pyrowave_decoder_push_packet pyrowave_decoder_decode_is_ready \
            pyrowave_decoder_decode_cpu_buffer_synchronous; do
            grep -Eq "[[:space:]]${symbol}$" /tmp/pyrowave-symbols.txt || {
              printf 'Missing required PyroWave symbol: %s\\n' "$symbol" >&2
              exit 1
            }
          done


      - name: Download webOS packaging CLI
        uses: robinraju/release-downloader@v1.9
        with:
          repository: webosbrew/ares-cli-rs
          latest: true
          fileName: "ares-package_*_amd64.deb"
          out-file-path: temp

      - name: Build test app with bundled decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./temp/*.deb
          source UPSTREAM.lock
          git clone --filter=blob:none https://github.com/${AURORA_REPO}.git aurora
          cd aurora
          git checkout --detach "${AURORA_COMMIT}"
          git submodule update --init --recursive
          cd ..
          python3 patches/add_pyrowave_toggle.py
          python3 patches/add_pyrowave_protocol.py
          python3 patches/wire_pyrowave_codec.py
          python3 patches/connect_pyrowave_ingress.py
          python3 patches/diagnose_pyrowave_connection.py
          cd aurora
          printf '\n' >> cmake/PackageWebOS.cmake
          cat >> cmake/PackageWebOS.cmake <<'CMAKE'
          install(DIRECTORY "${CMAKE_SOURCE_DIR}/../stage/lib/" DESTINATION lib/pyrowave USE_SOURCE_PERMISSIONS)
          install(FILES "${CMAKE_SOURCE_DIR}/../stage/lib/libstdc++.so.6" DESTINATION lib/pyrowave)
          CMAKE
          export CI=true
          export TOOLCHAIN_FILE=/tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake
          ./scripts/webos/easy_build.sh \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEBOS_APPINFO_ID=com.pyrowave.lgc5.test \
            -DWEBOS_APPINFO_TITLE="LG C5 PyroWave Test"
          test -n "$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"

      - name: Upload test app IPK
        uses: actions/upload-artifact@v4
        with:
          name: lgc5-pyrowave-test-ipk
          path: aurora/dist/*.ipk
          if-no-files-found: error

      - name: Upload ARM32 decoder and test executable
        uses: actions/upload-artifact@v4
        with:
          name: lgc5-pyrowave-decoder-arm32
          path: stage/
          if-no-files-found: error
